<!doctype html>
<!--
  Open Graph card (1200×630). Rendered by identity.mjs into public/og.png.
  Site fonts and dark-theme tokens; every claim is from the CV (title,
  location, and the three counters shown on the site).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; font-weight: 400 600; src: url('../../../src/assets/fonts/inter-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 500 700; src: url('../../../src/assets/fonts/space-grotesk-latin.woff2') format('woff2'); }

  :root {
    --bg: #0b0d0f; --fg: #eceef0; --muted: #a1a9b2; --subtle: #878f98;
    --line: #242a30; --accent: #4fd8c4; --grid: rgb(236 238 240 / 0.055);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 85% 75% at 70% 40%, #000 30%, transparent 80%);
  }
  .glow {
    position: absolute; width: 620px; height: 620px; right: -60px; top: -40px;
    background: radial-gradient(circle, rgb(79 216 196 / 0.22), transparent 62%);
  }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--accent); }

  .copy { position: absolute; left: 80px; top: 92px; width: 640px; }
  .url {
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    font-size: 19px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    display: inline-flex; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  h1 {
    margin-top: 40px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 96px; line-height: 0.95; letter-spacing: -0.02em;
  }
  .role { margin-top: 22px; font-size: 32px; font-weight: 600; color: var(--accent); }
  .stack { margin-top: 16px; font-size: 25px; color: var(--muted); }
  .stats {
    position: absolute; left: 80px; right: 80px; bottom: 64px;
    display: flex; gap: 0; border-top: 1px solid var(--line); padding-top: 28px;
  }
  .stat { flex: 1; }
  .stat b {
    display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 8px; font-size: 19px; color: var(--subtle); }

  /* Portrait: a head-and-shoulders window onto the untouched photo. */
  .portrait {
    position: absolute; right: 96px; top: 70px;
    width: 316px; height: 316px; border-radius: 50%;
    padding: 6px;
    background: conic-gradient(from 210deg, var(--accent), rgb(79 216 196 / 0.15) 40%, var(--accent) 75%, rgb(79 216 196 / 0.15));
    box-shadow: 0 0 80px -10px rgb(79 216 196 / 0.45);
  }
  .portrait .frame {
    position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    background: #181c20; border: 4px solid var(--bg);
  }
  /*
    The photo is 680px square; the face is centred near (308, 212). Show a
    440px square around it (x 88–528, y 0–440), uniformly scaled — never
    stretched.
  */
  .portrait img {
    position: absolute;
    width: calc(296px * 680 / 440);
    height: auto;
    left: calc(-88px * 296 / 440);
    top: 0;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>

  <div class="copy">
    <div class="url"><span class="dot"></span>omar-borhom.vercel.app</div>
    <h1>Omar Borhom</h1>
    <p class="role">Backend-Focused Full-Stack Developer</p>
    <p class="stack">Laravel · React · PyTorch — Damascus, Syria</p>
  </div>

  <div class="portrait"><div class="frame"><img src="../../../public/images/profile.jpg" alt="" /></div></div>

  <div class="stats">
    <div class="stat"><b>150+</b><span>REST endpoints shipped</span></div>
    <div class="stat"><b>20+</b><span>React components built</span></div>
    <div class="stat"><b>60+</b><span>Technical indicators engineered</span></div>
  </div>
</body>
</html>
