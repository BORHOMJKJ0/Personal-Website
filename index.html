<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Populated at runtime per language by src/lib/seo.ts -->
    <title>Omar Borhom — Backend-Focused Full-Stack Developer</title>
    <meta
      name="description"
      content="Final-year Artificial Intelligence student and backend-focused full-stack developer. Laravel APIs, React dashboards and deep learning for financial time-series."
    />
    <meta name="author" content="Omar Borhom" />
    <link rel="canonical" href="https://omar-borhom.vercel.app/" />
    <link rel="alternate" hreflang="en" href="https://omar-borhom.vercel.app/" />
    <link rel="alternate" hreflang="ar" href="https://omar-borhom.vercel.app/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="https://omar-borhom.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Omar Borhom" />
    <meta property="og:title" content="Omar Borhom — Backend-Focused Full-Stack Developer" />
    <meta
      property="og:description"
      content="Laravel APIs, React dashboards and deep learning for financial time-series."
    />
    <meta property="og:url" content="https://omar-borhom.vercel.app/" />
    <meta property="og:image" content="https://omar-borhom.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SY" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omar Borhom — Backend-Focused Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Laravel APIs, React dashboards and deep learning for financial time-series."
    />
    <meta name="twitter:image" content="https://omar-borhom.vercel.app/og.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!--
      Theme + direction are applied BEFORE first paint so there is no flash of
      the wrong theme and no LTR→RTL jump. Kept inline and dependency-free.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;

          // English is the default. The browser language is deliberately not
          // consulted — Arabic is shown only when explicitly requested, via
          // the ?lang= param or a stored toggle choice. Keep this in step with
          // detectLanguage() in src/i18n/index.ts.
          var qs = new URLSearchParams(window.location.search).get('lang');
          var saved = localStorage.getItem('lang');
          var lang =
            qs === 'ar' || qs === 'en' ? qs : saved === 'ar' || saved === 'en' ? saved : 'en';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          /* private mode / blocked storage: fall through to the markup defaults */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
